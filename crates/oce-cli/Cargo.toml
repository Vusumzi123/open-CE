[package]
name = "oce-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Open CE command-line tools"

[[bin]]
name = "oce"
path = "src/main.rs"

[dependencies]
oce-core = { workspace = true }
oce-plugin = { workspace = true }
oce-bsa = { workspace = true }
oce-data = { workspace = true }
oce-nif = { workspace = true }
oce-dds = { workspace = true }
minifb = "0.29"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.27"
pollster = "0.3"
wgpu = "0.19"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["dds"] }
